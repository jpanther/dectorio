[mod-name]
Dectorio=Dectorio

[mod-description]
Dectorio=Přidává dekorativní prvky pro zkrášlení vaší továrny. V současné době zahrnuje barevné signály, dřevěné, řetězové, kamenné a betonové stěny, dřevěné podlahové desky, štěrkové a betonové styly.

